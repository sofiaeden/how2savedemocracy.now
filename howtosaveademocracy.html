<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>

  <link rel="stylesheet" href="https://use.typekit.net/qmi1ufv.css">

  <style>
    :root{
      --play-x: 50%;
      --play-y: 46%;
    }

    body{
      margin: 0;
      min-height: 100vh;

      background: linear-gradient(270deg, #a0ccef, #71ace2, #4483c6, #0b3b73);
      background-size: 600% 600%;
      animation: bg 20s ease infinite;

      color: white;
      font-family: "jacquard-12", sans-serif;
      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes bg{
      0%{ background-position: 0% 50%; }
      50%{ background-position: 100% 50%; }
      100%{ background-position: 0% 50%; }
    }

    /* HEADER */
    .site-header{
      position: sticky;
      top: 0;
      width: 100%;
      padding: 20px 0 10px;

      display: flex;
      flex-direction: column;
      align-items: center;

      z-index: 1000;
    }

    h1{
      margin: 0;
      font-weight: 400;
    }

    .nav-links{
      margin-top: 20px;
      display: flex;
      gap: 40px;
    }

    .nav-links a{
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .nav-links a:hover{
      text-decoration: underline;
    }

    /* MAIN – osynlig layout-wrapper */
    .page-content{
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 30px 16px 80px;
      box-sizing: border-box;
    }

    /* OSYNLIG “RUTA” (bara layout) */
    .content-box{
      width: min(1000px, 100%);
      padding: 0;
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;

      background: none;
      border: none;
    }

    /* TV */
    .tv{
      width: min(810px, 100%); /* 10% mindre än 900px */
      position: relative;
    }

    .tv-img{
      width: 100%;
      display: block;
    }

    /* PLAY – följer TV:n i proportion */
    .play{
      position: absolute;
      left: var(--play-x);
      top: var(--play-y);
      transform: translate(-50%, -50%); /* ✅ ingen scale här */
      cursor: pointer;
      z-index: 10;

      width: 18%;        /* ✅ procent av TV:n */
      max-width: 110px;  /* ✅ tak */
      min-width: 48px;   /* ✅ golv */
      height: auto;
    }

    /* MOBIL */
    @media (max-width: 700px){
      .nav-links{
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }

      :root{
        --play-y: 44%;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <h1>Welcome to my homepage</h1>

    <nav class="nav-links">
      <a href="index.html">homepage</a>
      <a href="about.html">about</a>
      <a href="fanpage.html">fanpage</a>
      <a href="links.html">links</a>
      <a href="guestbook.html">guestbook</a>
    </nav>
  </header>

  <main class="page-content">
    <section class="content-box">
      <!-- Preload GIF -->
      <img src="TV9.0.gif" alt="" style="display:none;">

      <div class="tv">
        <img id="tvImage" class="tv-img" src="TV tom.png" alt="TV off">
        <img id="playGif" class="play" src="play3.png" alt="Play">
      </div>

      <iframe id="music" width="0" height="0" src="" allow="autoplay"></iframe>
    </section>
  </main>

  <script>
    const playGif = document.getElementById("playGif");
    const tvImage = document.getElementById("tvImage");
    const music = document.getElementById("music");

    let started = false;

    playGif.addEventListener("click", () => {
      if (started) return;
      started = true;

      tvImage.src = "";
      tvImage.src = "TV9.0.gif?v=" + Date.now();

      playGif.style.display = "none";

      music.src =
        "https://www.youtube.com/embed/jo1ACY-1wzc?autoplay=1&loop=1&playlist=jo1ACY-1wzc";
    });
  </script>
</body>
</html>
